name: Delta Auto Key Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find and Extract ZIP
        shell: pwsh
        run: |
          Write-Host "Searching ZIP archives..."

          $zip = Get-ChildItem -Path . -Filter "*.zip" -Recurse |
            Select-Object -First 1

          if (-not $zip) {
            Write-Error "ZIP archive not found!"
            exit 1
          }

          Write-Host "Found ZIP: $($zip.FullName)"

          $extractPath = Join-Path $env:GITHUB_WORKSPACE "extracted"

          New-Item -ItemType Directory -Force -Path $extractPath | Out-Null

          Expand-Archive -Path $zip.FullName -DestinationPath $extractPath -Force

          Write-Host "ZIP extracted successfully!"

          Get-ChildItem -Path $extractPath -Recurse |
            Select-Object FullName

      - name: Find Project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path extracted -Recurse -Filter "DeltaAutoKey.csproj" |
            Select-Object -First 1

          if (-not $project) {
            Write-Error "DeltaAutoKey.csproj not found inside ZIP!"
            exit 1
          }

          Write-Host "Project found: $($project.FullName)"

          "PROJECT_PATH=$($project.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore Dependencies
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_PATH"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT_PATH" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -o publish

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeltaAutoKey-Windows
          path: publish/DeltaAutoKey.exe
          if-no-files-found: error
