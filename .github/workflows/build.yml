name: Delta Auto Key Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    name: Build Windows EXE

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show .NET information
        shell: pwsh
        run: |
          dotnet --info

      - name: Find ZIP archive
        shell: pwsh
        run: |

          Write-Host "Searching for Delta Auto Key ZIP..."

          $zip = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.zip" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $zip) {
            Write-Error "ZIP archive not found!"
            exit 1
          }

          Write-Host "ZIP found:"
          Write-Host $zip.FullName

          "ZIP_PATH=$($zip.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Extract project
        shell: pwsh
        run: |

          Write-Host "Extracting project..."

          $destination = Join-Path `
            $env:GITHUB_WORKSPACE `
            "extracted"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          Expand-Archive `
            -Path $env:ZIP_PATH `
            -DestinationPath $destination `
            -Force

          Write-Host "Extraction completed!"

      - name: Find DeltaAutoKey.csproj
        shell: pwsh
        run: |

          $project = Get-ChildItem `
            -Path extracted `
            -Filter "DeltaAutoKey.csproj" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $project) {
            Write-Error "DeltaAutoKey.csproj not found!"
            exit 1
          }

          Write-Host "Project found:"
          Write-Host $project.FullName

          "PROJECT_PATH=$($project.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Restore dependencies
        shell: pwsh
        run: |

          Write-Host "Restoring dependencies..."

          dotnet restore "$env:PROJECT_PATH" `
            --runtime win-x64

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Delta Auto Key
        shell: pwsh
        run: |

          Write-Host "Building Delta Auto Key..."

          dotnet publish "$env:PROJECT_PATH" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PlatformTarget=x64 `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o publish

          if ($LASTEXITCODE -ne 0) {
            Write-Error "BUILD FAILED!"
            exit $LASTEXITCODE
          }

          Write-Host "BUILD SUCCESSFUL!"

      - name: Verify EXE
        shell: pwsh
        run: |

          $exe = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish/DeltaAutoKey.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "DeltaAutoKey.exe not found!"
            exit 1
          }

          $file = Get-Item $exe

          Write-Host "EXE created successfully!"

          Write-Host "File:"
          Write-Host $file.FullName

          Write-Host "Size:"
          Write-Host "$([math]::Round($file.Length / 1MB, 2)) MB"

          $hash = Get-FileHash `
            -Path $exe `
            -Algorithm SHA256

          Write-Host "SHA256:"
          Write-Host $hash.Hash

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeltaAutoKey-v1.1-Windows-x64
          path: publish/DeltaAutoKey.exe
          if-no-files-found: error
          retention-days: 30
